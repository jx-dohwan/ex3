name: SSM CI/CD Pipeline

# 1. 트리거: main 브랜치에 푸시될 때 실행
on:
  push:
    branches:
      - main

jobs:
  deploy-to-private:
    runs-on: ubuntu-latest  # GitHub 호스팅 러너는 ubuntu-latest를 지정해야 합니다.

    steps:
      # Step 1: GitHub 저장소 소스코드 체크아웃
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # Step 2: AWS IAM 자격 증명 구성
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: 컨테이너 배포 및 S3 파일 싱크
        run: |
          aws ssm send-command \
            --instance-ids "i-039b3a150985ec04d" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy website from S3 to Private AL2023" \
            --parameters 'commands=[
              "systemctl stop nginx || true",
              "aws s3 sync s3://std04-state-bucket-2026/ /usr/share/nginx/html --delete",
              "docker stop nginx-container || true",
              "docker rm nginx-container || true",
              "docker run -d --name nginx-container -p 80:80 -v /usr/share/nginx/html:/usr/share/nginx/html:ro nginx:1.31.3-alpine"
            ]' \
            --region ap-northeast-2