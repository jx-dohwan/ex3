name: SSM CI/CD Pipeline

# 1. 트리거: main 브랜치에 푸시될 때 실행
on:
  push:
    branches:
      - main

jobs:
  deploy-to-private:
    runs-on: ubuntu-latest  # GitHub 호스팅 러너는 ubuntu-latest를 지정해야 합니다.

    steps:
      # Step 1: GitHub 저장소 소스코드 체크아웃
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # Step 2: AWS IAM 자격 증명 구성
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # Step 3: GitHub의 정적 웹 파일을 S3 버킷으로 업로드
      - name: S3 정적 파일 업로드
        run: |
          aws s3 sync ./html s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # Step 4: SSM Send-Command로 프라이빗 AL2023에 배포 지시
      - name: S3에서 프라이빗으로 배포
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.PRIVATE_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy website from S3 to Private AL2023" \
            --parameters 'commands=[
              "sudo aws s3 sync s3://${{ secrets.S3_BUCKET_NAME }}/ /usr/share/nginx/html --delete",
              "sudo chown -R ec2-user:nginx /usr/share/nginx/html",
              "sudo systemctl reload nginx"
            ]' \
            --region ap-northeast-2